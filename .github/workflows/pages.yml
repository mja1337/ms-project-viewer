# Builds the static site and deploys it to GitHub Pages.
#
# NOT ACTIVE YET: it only runs when started by hand (workflow_dispatch), and
# it needs Pages to be switched on in the repo settings (Settings > Pages >
# Source: GitHub Actions). Nothing is published until both are done.
# To deploy on every push to main later, add:
#   push:
#     branches: [main]
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
